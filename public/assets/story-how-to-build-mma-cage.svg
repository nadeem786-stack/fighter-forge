<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="grad-E10B1F" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E10B1F" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#141414" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="1" opacity="0.6"/>
    </pattern>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0A0A0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#grad-E10B1F)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Chamfer Border -->
  <polygon points="24,24 1176,24 1176,606 24,606" fill="none" stroke="#2A2A2A" stroke-width="2"/>
  <polygon points="30,30 1170,30 1170,600 30,600" fill="none" stroke="#E10B1F" stroke-width="1" opacity="0.4"/>

  <!-- Top Brand Tag -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="180" height="32" rx="4" fill="#0F0F0F" stroke="#333333" stroke-width="1"/>
    <text x="14" y="21" fill="#E10B1F" font-family="'Barlow', sans-serif" font-weight="900" font-size="12" letter-spacing="3">FIGHTER FORGE</text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(255, 75)">
    <rect x="0" y="0" width="220" height="32" rx="4" fill="#E10B1F" fill-opacity="0.15" stroke="#E10B1F" stroke-width="1.5"/>
    <text x="16" y="21" fill="#E10B1F" font-family="'Barlow', sans-serif" font-weight="800" font-size="12" letter-spacing="2">TRAINING FACILITIES</text>
  </g>

  <!-- Big Watermark Icon -->
  <text x="1000" y="440" font-size="280" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.03" font-family="sans-serif">⬡</text>

  <!-- Main Headline -->
  <text x="60" y="270" fill="#FFFFFF" font-family="'Bebas Neue', 'Anton', sans-serif" font-size="68" letter-spacing="2" font-weight="bold">
    HOW TO BUILD AN MMA CAGE
  </text>

  <!-- Red Accent Divider Line -->
  <rect x="60" y="300" width="120" height="5" fill="#E10B1F"/>

  <!-- Subtitle -->
  <text x="60" y="360" fill="#D4D4D8" font-family="'Barlow', sans-serif" font-size="20" font-weight="600" letter-spacing="3">
